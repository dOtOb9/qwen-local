name: Windows Build & Release

on:
  push:
    branches: [master]
    paths:
      - "frontend-tauri/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Set patch version for this build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            const [major, minor] = c.version.split('.');
            c.version = major + '.' + minor + '.' + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend-tauri
          tagName: app-v__VERSION__
          releaseName: "Qwen Local Chat v__VERSION__"
          releaseBody: "Automated build from push to master."
          releaseDraft: false
          prerelease: false
