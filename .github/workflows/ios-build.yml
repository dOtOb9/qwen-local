name: iOS Device Build (unsigned)

on:
  push:
    branches: [master]
    paths:
      - "frontend-tauri/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-ios-device:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci

      - name: Build for device via tauri CLI (unsigned)
        run: |
          npm run tauri ios build -- --target aarch64 --debug --ci -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .app into .ipa
        id: package
        run: |
          cd src-tauri/gen/apple
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found; build likely failed" >&2
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r qwen-local.ipa Payload
          echo "ipa_path=src-tauri/gen/apple/qwen-local.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: frontend-tauri/src-tauri/gen/apple/qwen-local.ipa
          if-no-files-found: warn

      - name: Upload full apple build dir (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-debug
          path: frontend-tauri/src-tauri/gen/apple
          retention-days: 3
