name: Agent Dev Loop

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  dev-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: frontend-tauri
        run: npm ci

      - name: Run agent dev loop cycle
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          settings: |
            {
              "env": { "DEBUG": "true" }
            }
          claude_args: >-
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(cargo:*),Edit,Write,Read,Glob,Grep"
            --max-turns 100
          prompt: |
            あなたは qwen-local リポジトリ(Tauriデスクトップアプリ、本体は
            frontend-tauri/)の自律開発エージェントです。以下の手順で、
            Issueを1件だけ選んで実装からブランチpushまでを行ってください。
            詳細な設計は TaskSheets/2026-09-12-agent-harness-design.md
            にあります。

            注意: このアクションの仕様上、PRを自分で作成することはできません
            (`gh pr create`はブロックされます)。ブランチをpushした後は、
            人間がワンクリックでPRを作成できる「compare URL」をIssueコメントに
            貼るところまでを行ってください。

            ## 手順
            1. `gh issue list --repo dOtOb9/qwen-local --label agent-ready --state open`
               で候補を確認する。
            2. `agent-in-progress` ラベルが付いていないものを1件選ぶ
               (複数あれば番号が小さいものを優先)。該当が無ければ何もせず終了する。
            3. 選んだIssueに `gh issue edit <番号> --add-label agent-in-progress`
               でラベルを付ける。
            4. `git checkout -b agent/issue-<番号>-<短い英語slug>` でブランチを作成する。
            5. Issue本文の要求を実装する。対象は主に `frontend-tauri/src/`
               (TypeScript/React) と `frontend-tauri/src-tauri/src/` (Rust)。
               **このIssueの実装に直接必要なファイルだけを変更すること。**
               このリポジトリは他のセッションも並行して開発しているため、
               作業中に見かけた無関係な既存コード(他機能のコンポーネントや
               TaskSheetsの他ファイルなど)が気になっても、リファクタ・
               削除・簡略化をしない。参考のために読むのは問題ないが、
               編集はIssueのスコープ内のファイルに限定する。
            6. `frontend-tauri/` で `npm run build`、`frontend-tauri/src-tauri/` で
               `cargo build` を実行し、両方成功することを確認する
               (これはLinuxランナー上での簡易コンパイル確認であり、実際にWindows
               向けにビルドできる保証ではない。本物のWindows向けビルド確認は、
               PR作成後に`windows-pr-check.yml`が自動実行して行う)。
               - 失敗したら原因を修正して再試行する(2回まで)。
               - それでも解決しない場合は、
                 `gh issue edit <番号> --remove-label agent-in-progress --add-label agent-blocked`
                 とし、詰まった理由を `gh issue comment <番号>` で説明して終了する
                 (中途半端な実装をpushしない)。
            7. 成功したら、commitする前に必ず `git diff --stat` で変更ファイル
               一覧を確認し、このIssueと無関係なファイルが含まれていないか
               チェックする。含まれていたら`git checkout -- <該当ファイル>`
               で元に戻してから、変更したファイルだけを明示的に`git add`
               してコミットする(`git add -A`は使わない)。
            8. `git push -u origin <ブランチ名>` でpushする。
            9. 以下の形式で「compare URL」を組み立てる(タイトル・本文はURLエンコードする。
               本文には `Closes #<番号>` を含める。GitHubの自動クローズは
               PRが実際にマージされた瞬間に発動する仕組みなので、その時点で
               既に人間がレビュー・承認済みであり問題ない):
               `https://github.com/dOtOb9/qwen-local/compare/master...<ブランチ名>?quick_pull=1&title=<タイトル>&body=<本文>`
            10. `gh issue edit <番号> --remove-label agent-in-progress --add-label agent-ready-for-pr`
            11. `gh issue comment <番号> --body "実装が完了しました。以下のリンクからPRを作成してください: <compare URL>"`
            12. `TaskSheets/YYYY-MM-DD-issue-<番号>.md` を規定のテンプレート
                (タイトル/日付/ステータス/目的/やったこと/次にやること)で作成し、
                同じブランチ・同じコミットに含める。

            ## 厳守事項(ガードレール)
            - `master` への直接push・force pushは絶対に行わない。
            - PRの作成・マージは行わない(できない仕様でもあるが、意図的にも行わない。
              人間がcompare URLからPRを作成し、レビュー後にマージする)。
            - `.github/workflows/` 配下のファイルは変更しない。
            - 依存関係の破壊的アップグレード、バージョン/リリースタグの操作はしない。
            - シークレットやトークンの扱いを変更する変更はしない。
            - 1回の実行で対応するIssueは1件のみ。
            - 自信を持って実装できない設計判断が必要な場合は、無理に実装せず
              `agent-blocked` にして人間に委ねる。
